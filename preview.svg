    <text x="262" y="190" fill="#5f6b67">$ git status --short</text>
    <text x="262" y="212" fill="#b78b26"> M src/components/Hero.tsx</text>
    <text x="262" y="234" fill="#b78b26"> M src/styles/theme.css</text>
    <text x="262" y="256" fill="#1a6840">?? src/components/Footer.tsx</text>
